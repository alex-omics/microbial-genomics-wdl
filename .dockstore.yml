version: 1.2

# Dockstore registration for microbial-genomics-wdl.
#
# `filters.branches` is per-workflow, so Dockstore only looks for a descriptor on
# the branches listed for it.
#
# Paths are absolute from the repository root and must begin with a slash.

workflows:

  - name: assembly_qc
    subclass: WDL
    primaryDescriptorPath: /workflows/assembly_qc/assembly_qc.wdl
    readMePath: /workflows/assembly_qc/README.md
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/assembly-qc-tasks

  - name: call_ospA_type
    subclass: WDL
    primaryDescriptorPath: /workflows/call_ospA_type/call_ospA_type.wdl
    readMePath: /workflows/call_ospA_type/README.md
    testParameterFiles:
      - /tests/call_ospA_type_inputs.json
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/call-ospa-type

  - name: classify_kraken2_batched
    subclass: WDL
    primaryDescriptorPath: /workflows/classify_kraken2_batched/classify_kraken2_batched.wdl
    readMePath: /workflows/classify_kraken2_batched/README.md
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/kraken2-batched
        - feature/kraken2-fastq-input

  - name: fetch_reads_from_sra
    subclass: WDL
    primaryDescriptorPath: /workflows/fetch_reads_from_sra/fetch_reads_from_sra.wdl
    readMePath: /workflows/fetch_reads_from_sra/README.md
    testParameterFiles:
      - /tests/fetch_reads_from_sra_inputs.json
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/fetch-reads-from-sra

  - name: filter_reads
    subclass: WDL
    primaryDescriptorPath: /workflows/filter_reads/filter_reads.wdl
    readMePath: /workflows/filter_reads/README.md
    testParameterFiles:
      - /tests/filter_reads_inputs.json
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/filter-reads

  - name: rna_seq_counts
    subclass: WDL
    primaryDescriptorPath: /workflows/rna_seq_counts/rna_seq_counts.wdl
    readMePath: /workflows/rna_seq_counts/README.md
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/rna-seq-counts

  - name: multimodal_gwas
    subclass: WDL
    primaryDescriptorPath: /workflows/multimodal_gwas/wf_multimodal_gwas.wdl
    readMePath: /docs/workflows/multimodal_gwas.md
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/multimodal-gwas

  - name: pyseer_gwas
    subclass: WDL
    primaryDescriptorPath: /workflows/pyseer_gwas/pyseer_gwas.wdl
    readMePath: /workflows/pyseer_gwas/README.md
    testParameterFiles:
      - /tests/pyseer_gwas_inputs.json
    authors:
      - name: Alex Arvanitis
        email: aarvanitis1@mgh.harvard.edu
    filters:
      branches:
        - main
        - feature/pyseer-gwas

  - name: dna_methylation_calling
    subclass: WDL
